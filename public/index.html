<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TestCase Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="authScreen" class="screen">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <h1>Test Runner</h1>
                    <p>Track your test cases with ease</p>
                </div>
                <div class="auth-tabs">
                    <button class="auth-tab active" data-tab="login">Login</button>
                    <button class="auth-tab" data-tab="register">Register</button>
                </div>
                <div class="auth-body">
                    <div class="auth-input-group">
                        <label for="usernameInput">Username</label>
                        <input type="text" id="usernameInput" placeholder="Enter your username" autocomplete="off" spellcheck="false">
                    </div>
                    <div id="authError" class="auth-error"></div>
                    <button class="btn btn-primary btn-full" id="authSubmit">Login</button>
                </div>
            </div>
        </div>
    </div>

    <div id="dashScreen" class="screen" style="display:none">
        <div class="container">
            <header>
                <div>
                    <h1>TestCase Tracker</h1>
                    <p>Welcome, <strong id="welcomeUser"></strong></p>
                </div>
                <button class="btn btn-outline" id="logoutBtn">Logout</button>
            </header>

            <div class="search-bar">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search categories..." autocomplete="off" spellcheck="false">
            </div>

            <div class="toolbar">
                <button class="btn btn-primary" id="addCategoryBtn">+ Add Category</button>
                <div class="toolbar-right">
                    <span class="save-indicator" id="saveIndicator">✓ Saved</span>
                    <button class="btn btn-secondary" id="resetBtn">Reset All</button>
                    <button class="btn btn-secondary" id="exportBtn">Export</button>
                    <button class="btn btn-secondary" id="importBtn">Import</button>
                    <input type="file" id="importFile" accept=".json" style="display:none">
                </div>
            </div>

            <div id="categoryList"></div>

            <div id="dashStatus" class="status"></div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
